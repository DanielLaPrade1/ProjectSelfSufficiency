services:
  postgres:
    image: postgres:latest
    
    container_name: cropdb-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PW: ${POSTGRES_PW}

    ports:
      - "5432:5432" 
     
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
volumes:
  postgres_data: